<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>English Master App - Advanced Reading Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@300;400;700&family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .animate-fadeIn { animation: fadeIn 0.4s ease-out forwards; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #f8fafc; border-radius: 4px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        .glass-header { background: rgba(79, 70, 229, 0.95); backdrop-filter: blur(8px); }

        /* Grammar Highlight Interactive Styles */
        .grammar-item {
            transition: all 0.2s ease;
            border-radius: 0.25rem;
            padding: 0 0.125rem;
            border-bottom: 2px solid transparent;
        }

        /* Verbs (動詞の語法) - Blue */
        .hl-verbs { background-color: transparent; }
        .hl-verbs.active { background-color: #DBEAFE; color: #1E3A8A; border-bottom: 2px solid #3B82F6; cursor: pointer; }
        .hl-verbs.active:hover { background-color: #BFDBFE; }

        /* Idioms (イディオム) - Amber */
        .hl-idioms { background-color: transparent; }
        .hl-idioms.active { background-color: #FEF3C7; color: #78350F; border-bottom: 2px solid #F59E0B; cursor: pointer; }
        .hl-idioms.active:hover { background-color: #FDE68A; }

        /* Comparisons (比較) - Emerald */
        .hl-comparisons { background-color: transparent; }
        .hl-comparisons.active { background-color: #D1FAE5; color: #064E3B; border-bottom: 2px solid #10B981; cursor: pointer; }
        .hl-comparisons.active:hover { background-color: #A7F3D0; }
        
        /* Modifiers (代名詞・形容副詞) - Teal */
        .hl-modifiers { background-color: transparent; }
        .hl-modifiers.active { background-color: #CCFBF1; color: #115E59; border-bottom: 2px solid #14B8A6; cursor: pointer; }
        .hl-modifiers.active:hover { background-color: #99F6E4; }
        
        /* Slash Reading Styles */
        .slash {
            display: none;
            color: #9CA3AF;
            margin: 0 0.15rem;
            user-select: none;
            font-weight: 300;
        }
        .slash-mode-active .slash { display: inline; }

        /* Translation Ruby Styles */
        ruby {
            ruby-align: left;
            ruby-position: under;
        }
        rt.translation {
            display: none;
            color: #64748B;
            font-size: 0.75rem;
            font-family: 'Inter', sans-serif;
            font-weight: 500;
            user-select: none;
        }
        .translation-mode-active { line-height: 2.8 !important; }
        .translation-mode-active rt.translation { display: block; }
        .translation-mode-active .slash { margin-bottom: 1.2rem; vertical-align: top; }

        /* Paraphrase Ruby Styles */
        rt.paraphrase {
            display: none;
            color: #0284c7;
            font-size: 0.75rem;
            font-family: 'Inter', sans-serif;
            font-weight: 500;
            user-select: none;
        }
        .paraphrase-mode-active { line-height: 2.8 !important; }
        .paraphrase-mode-active rt.paraphrase { display: block; }
        .paraphrase-mode-active .slash { margin-bottom: 1.2rem; vertical-align: top; }
        
        /* Paragraph Indent */
        .passage-container p { text-indent: 1.5rem; }

        /* TTS Highlight Styles */
        .reading-highlight {
            background-color: #FEF08A !important;
            transition: background-color 0.2s;
            border-radius: 0.25rem;
            box-shadow: 0 0 0 4px #FEF08A;
        }
        .hover-reading-highlight {
            background-color: #FEF9C3 !important;
            transition: background-color 0.2s;
            border-radius: 0.25rem;
        }
        .hover-readable { cursor: pointer; }

        @media print {
            @page { size: A4; margin: 10mm; }
            body { background: white !important; color: black !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
            header, aside, .print-hidden { display: none !important; }
            .lg\:col-span-3 { grid-column: 1 / -1 !important; width: 100% !important; margin: 0 !important; padding: 0 !important; }
            #main-content-container { border: none !important; box-shadow: none !important; padding: 0 !important; min-height: auto !important; }
            .passage-container { max-height: none !important; overflow: visible !important; border: none !important; background: transparent !important; padding: 0 !important; margin-bottom: 20px !important; font-size: 11pt !important; line-height: 1.6 !important; box-shadow: none !important; }
            #questions-container { page-break-before: always !important; break-before: page !important; }
            .question-block { page-break-inside: avoid !important; break-inside: avoid !important; border: none !important; box-shadow: none !important; padding: 5px 0 !important; margin-bottom: 15px !important; }
            .notes-section { page-break-before: always !important; break-before: page !important; }
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans flex flex-col min-h-screen pb-20">
    <header class="glass-header text-white shadow-lg p-4 sticky top-0 z-30 border-b border-indigo-500 print:hidden">
        <div class="max-w-7xl mx-auto flex flex-col md:flex-row justify-between items-center gap-3">
            <div>
                <h1 class="text-xl md:text-2xl font-black flex items-center gap-2 tracking-tight">
                    <span class="bg-white text-indigo-700 p-1.5 rounded-lg leading-none shadow-sm">🚀</span> 
                    English Master <span class="font-light text-indigo-200 text-lg hidden sm:inline">| Pre-1st Advanced Reading</span>
                </h1>
            </div>
            <div class="text-xs bg-indigo-900/50 px-4 py-2 rounded-full border border-indigo-400/50 shadow-inner flex items-center gap-2">

                Active: <span id="header-active-title" class="font-bold text-white tracking-wide"></span>
            </div>

    </header>

    <div class="max-w-7xl mx-auto w-full flex-1 p-4 md:p-6 grid grid-cols-1 lg:grid-cols-4 gap-6">
        <aside class="lg:col-span-1 bg-white rounded-2xl shadow-sm border border-slate-200 p-4 flex flex-col gap-3 h-fit lg:sticky lg:top-24 print:hidden">
            <h2 class="text-[11px] font-black uppercase tracking-widest text-slate-400 px-2 flex items-center gap-1"><span class="text-indigo-400">#</span> Select Essay</h2>
            <div id="sidebar-container" class="flex flex-col gap-1.5 max-h-[75vh] overflow-y-auto pr-2 pb-4">
                <!-- Injected via JS -->
            </div>
        </aside>

        <main class="lg:col-span-3 flex flex-col gap-6">
            <div id="main-content-container" class="bg-white rounded-2xl shadow-sm border border-slate-200 p-5 md:p-8 min-h-[60vh]">
                <!-- Injected via JS -->
            </div>
        </main>
    </div>

    <!-- Floating Info Panel -->
    <div id="info-panel" class="fixed bottom-6 left-1/2 transform -translate-x-1/2 bg-slate-800 text-white px-6 py-4 rounded-xl shadow-2xl z-50 flex items-start gap-4 max-w-md w-11/12 border border-slate-700 transition-all duration-300 opacity-0 pointer-events-none translate-y-2 print-hidden">
        <div class="flex-1">
            <h3 id="info-title" class="font-bold text-lg mb-1"></h3>
            <p id="info-desc" class="text-sm text-slate-300 leading-relaxed"></p>
        </div>
        <button id="close-panel" class="text-slate-400 hover:text-white transition-colors">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
            </svg>
        </button>
    </div>

    <script>
        const grammarDictionary = {
            "feel soft": { detail: "feel は第2文型(SVC)を作る知覚動詞で、C(補語)には必ず「形容詞」が来ます。「柔らかく」につられて副詞 softly を選ばないように注意。", example: "This blanket feels extremely soft." },
            "discuss the issue": { detail: "discuss は「〜について議論する」という意味の他動詞です。直後に about などの前置詞を置いてはいけません。", example: "We need to discuss the serious problem." },
            "explain to 人 why": { detail: "explain は第4文型（explain 人 事）がとれない動詞です。必ず explain 事 to 人 または explain to 人 事 の形になります。", example: "He explained to me how the machine works." },
            "do great harm": { detail: "do + 人/物 + harm で「〜に害を与える」。反対は do + 人/物 + good（〜のためになる）。", example: "Smoking does great harm to your lungs." },
            "rob A of B": { detail: "「A(人・場所)からB(物)を奪う」。直後には被害者(A)が来ます。", example: "The thief robbed him of his wallet." },
            "discourage A from V-ing": { detail: "「AがVするのを思いとどまらせる」。prevent A from V-ing と同じ文構造を作ります。", example: "The rain discouraged us from going out." },
            "have O V-p.p.": { detail: "have + O + 過去分詞 で「OをVしてもらう（使役）」または「OをVされる（被害）」。", example: "I had my hair cut yesterday." },
            "rise": { detail: "rise（上がる）は自動詞。raise（〜を上げる）は他動詞。区別が頻出です。", example: "The sun rises in the east. / Raise your hand." },
            "remind A of B": { detail: "「AにBを思い出させる」。of は情報伝達を表します。", example: "This song reminds me of my childhood." },
            "tell A from B": { detail: "「AとBを区別する、見分ける」。know A from B, distinguish A from B と同意です。", example: "It's hard to tell a fake from a genuine one." },
            "lie in": { detail: "「〜に存在する」。lie（自動詞）と lay（他動詞）の区別に注意。", example: "The problem lies in our lack of communication." },
            "fall short of": { detail: "「〜に達しない、及ばない」。期待や目標に届かない場合によく使われます。", example: "The results fell short of our expectations." },
            "result in": { detail: "「〜という結果になる」。主語（原因）が目的語（結果）につながります。", example: "The heavy rain resulted in severe flooding." },
            "turn out": { detail: "turn out (to be) 〜 で「〜であると判明する、〜という結果になる」。", example: "The rumor turned out to be true." },
            "put up with": { detail: "「耐える、我慢する」。endure, tolerate, stand, bear と同義です。", example: "I can't put up with this noise anymore." },
            "set about": { detail: "「〜に取り掛かる、着手する」。前置詞 about の後ろなので動名詞(V-ing)が来ます。", example: "She set about solving the complex problem." },
            "succeed in": { detail: "succeed in V-ing で「〜に成功する」。succeed to 〜（〜を継承する）との違いに注意。", example: "He succeeded in passing the difficult exam." },
            "have nothing to do with": { detail: "「〜と何の関係もない」。", example: "I have nothing to do with the incident." },
            "lay off": { detail: "「〜を解雇する」。不況などの経済的理由による一時解雇を指すことが多いです。", example: "The factory had to lay off 100 workers." },
            "give way to": { detail: "「〜に屈する、〜に道を譲る」。yield to, give in to と似た意味です。", example: "He refused to give way to fear." },
            "make it a rule to": { detail: "「Vすることを規則（習慣）にしている」。", example: "I make it a rule to get up at 6 a.m." },
            "call on": { detail: "「（人）を訪問する」。call at + 場所 と区別しましょう。", example: "I will call on him tomorrow." },
            "take place": { detail: "「（行事などが）行われる、起こる」。自動詞句なので受動態にしません。", example: "The Olympics take place every four years." },
            "come up with": { detail: "「（考えや解決策）を思いつく、提案する」。", example: "She came up with a brilliant idea." },
            "take the place of": { detail: "「〜に取って代わる」。replace とほぼ同意です。", example: "Robots will take the place of humans." },
            "make up for": { detail: "「〜を埋め合わせる、補う」。compensate for と同意です。", example: "I must work hard to make up for lost time." },
            "apply for": { detail: "「〜に申し込む」。apply to 〜（〜に当てはまる）との違いに注意。", example: "He applied for a new job." },
            "figure out": { detail: "「〜を理解する、解決する」。", example: "I can't figure out why she is crying." },
            "deal with": { detail: "「〜に対処する、〜を扱う」。cope with, handle と同義です。", example: "How do you deal with stress?" },
            "keep up with": { detail: "「（遅れずに）〜についていく」。", example: "It is hard to keep up with technological innovation." },
            "get over": { detail: "「（困難や病気）を乗り越える、回復する」。overcome と同義です。", example: "It took him a long time to get over the shock." },
            "take part in": { detail: "「〜に参加する」。participate in, join in と同意です。", example: "I will take part in the speech contest." },
            "do away with": { detail: "「〜を廃止する、取り除く」。abolish, eliminate と同意です。", example: "We should do away with such outdated rules." },
            "stand out": { detail: "「際立つ、目立つ」。", example: "Her red coat made her stand out." },
            "cope with": { detail: "「（困難なこと）にうまく対処する」。", example: "He is unable to cope with the pressure." },
            "keep in mind": { detail: "「〜を心に留める、覚えておく」。", example: "Keep in mind that safety comes first." },
            "take it for granted": { detail: "take it for granted that... で「...ということを当然のことと思う」。", example: "I took it for granted that you would come." },
            "run out of": { detail: "「〜を使い果たす、切らす」。", example: "We have run out of sugar." },
            "go through with": { detail: "「（困難なこと）をやり遂げる、実行する」。", example: "He decided to go through with the surgery." },
            "count on": { detail: "「〜を当てにする、頼りにする」。rely on, depend on と同義です。", example: "You can count on him to do a good job." },
            "carry out": { detail: "「（計画、実験など）を実行する」。execute, perform と同義です。", example: "They carried out the experiment successfully." },
            "major in": { detail: "「（大学で）〜を専攻する」。", example: "She majored in economics at college." },
            "make sense": { detail: "「理にかなう、意味をなす」。", example: "What you're saying doesn't make sense." },
            "make fun of": { detail: "「〜をからかう、笑いものにする」。", example: "It is cruel to make fun of others." },
            "find fault with": { detail: "「〜のあら探しをする、非難する」。", example: "He is always finding fault with my work." },
            "come of age": { detail: "「成人になる、十分に発達する」。", example: "The new technology has finally come of age." },
            "look over": { detail: "「〜をざっと見る、見直す」。", example: "Please look over these documents." },
            "keep in touch with": { detail: "「〜と連絡を取り合う」。", example: "Let's keep in touch with each other." },
            "take advantage of": { detail: "「（機会）を利用する、（弱み）につけこむ」。", example: "You should take advantage of this opportunity." },
            "break into": { detail: "「（建物や口座などに）不法侵入する」。", example: "Someone broke into my house last night." },
            "break out": { detail: "「（戦争、火事などが）突然発生する」。", example: "World War II broke out in 1939." },
            "wait on": { detail: "「（客）に応対する、給仕する」。serve と同義です。", example: "The clerk waited on us politely." },
            "take into account": { detail: "「〜を考慮に入れる」。", example: "You must take his age into account." },
            "get along with": { detail: "「（人）と仲良くやっていく」。", example: "She gets along well with her colleagues." },
            "hand in": { detail: "「（宿題やレポートなど）を提出する」。", example: "Please hand in your report by Friday." },
            "look up": { detail: "「（辞書やネットで言葉・情報）を調べる」。", example: "look it up in a dictionary." },
            "account for": { detail: "「〜の割合を占める、〜の理由を説明する」。グラフ問題や長文の因果関係で超頻出。", example: "Lung cancer accounts for 25% of cancer mortality." },
            "stand for": { detail: "「〜を表す、象徴する」。represent と同義です。略語の正式名称にも使われます。", example: "The colors stand for liberty and equality." },
            "get rid of": { detail: "「〜を取り除く、処分する」。eliminate, remove と同義です。", example: "We need to get rid of the old furniture." },
            "rule out": { detail: "「〜を除外する、否定する」。可能性を排除する際によく使われます。", example: "Police have not ruled out the possibility." },
            "call off": { detail: "「〜を中止する」。cancel と同義です。put off（延期する）と混同注意。", example: "She had to call off the meeting." },
            "come by": { detail: "「〜を手に入れる」。obtain と同義で、手に入れにくいものに使われます。", example: "It is difficult to come by that old video." },
            "twice as much as": { detail: "倍数表現。「倍数 + as + 原級 + as」で「〜の〇倍…だ」。", example: "This room is twice as large as that one." },
            "not so much A as B": { detail: "「AというよりむしろB」。Bの方に話者の重点が置かれます。", example: "He is not so much a scholar as a journalist." },
            "The more... the more...": { detail: "「The 比較級 ..., the 比較級 ...」で「〜すればするほど、ますます…」。", example: "The older we grow, the poorer our memory becomes." },
            "know better than to": { detail: "「〜するほど愚かではない（〜しないだけの分別がある）」。", example: "He knows better than to fight with his boss." },
            "no less than": { detail: "「〜もの多くの」。数が予想以上に多いことを強調します。", example: "He won no less than 1 million dollars." },
            "much less": { detail: "否定文に続いて「ましてや〜ない」。", example: "I can't speak English, much less French." },
            "superior to": { detail: "「〜より優れている」。than ではなく to を用いる形容詞です。", example: "This machine is superior to the old one." },
            "prefer A to B": { detail: "「BよりもAを好む」。こちらも to を使います。", example: "I prefer tea to coffee." },
            "by far the most": { detail: "最上級の強調表現。「飛び抜けて最も〜だ」。", example: "This is by far the most difficult question." },
            "all the better for": { detail: "「（理由があるからこそ）いっそう〜だ」。", example: "I like him all the better for his faults." },
            "that of": { detail: "比較の対象を揃える代名詞。複数名詞なら those of を用います。", example: "His salary is higher than that of his wife." },
            "an American friend of mine": { detail: "二重所有格。「私のアメリカ人の友人」。a my friend は不可。", example: "He is a good friend of mine." },
            "every two years": { detail: "「2年ごとに」。every + 複数名詞 で周期を表します。", example: "The festival is held every four years." },
            "hardly any": { detail: "「ほとんど〜ない（準否定）」。any と結びついて名詞を修飾します。", example: "I have hardly any money left." },
            "lately": { detail: "「（ここ）最近」。現在完了形とともに用いられることが多い副詞です。", example: "Have you seen him lately?" },
            "exhausting": { detail: "「（物事が）人を疲れさせる」。自分が疲れた場合は exhausted。", example: "The journey was extremely exhausting." },
            "convenient for": { detail: "「（物事が）都合が良い」。人を主語にできません（You are convenient は不可）。", example: "This tool is very convenient for cooking." },
            "capable of": { detail: "be capable of V-ing で「Vする能力がある」。", example: "He is capable of doing the job." },
            "almost all of": { detail: "「〜のほとんどすべて」。almost は副詞なので名詞を直接修飾できません。", example: "Almost all of the students passed." },
            "worth studying": { detail: "worth V-ing で「Vする価値がある」。", example: "This book is worth reading." },
            "Quite a few": { detail: "「かなり多くの（数）」。数えられる名詞につきます。", example: "Quite a few people attended the meeting." },
            "Most of": { detail: "「〜の大部分」。the などの限定語句が必要です。", example: "Most of my friends like soccer." },
            "little": { detail: "「ほとんど〜ない」。不可算名詞につきます。a little（少しある）との違いに注意。", example: "He has little interest in politics." },
            "others": { detail: "「他の人々/物」。Some 〜, while others ... の形で頻出します。", example: "Some like coffee, and others prefer tea." },
            "exciting": { detail: "「（物事が）人をワクワクさせる」。自分が興奮した場合は excited。", example: "It was an exciting game." },
            "by ourselves": { detail: "「私たち自身で、自力で」。", example: "We built this house by ourselves." },
            "one": { detail: "不特定の単数名詞の反復を避ける代名詞。", example: "If you need a pen, I'll lend you one." },
            "respectable": { detail: "「きちんとした、立派な」。respectful（敬意を表す）、respective（それぞれの）との違いに注意。", example: "He is a highly respectable gentleman." },
            "sensible": { detail: "「分別のある、賢明な」。sensitive（敏感な）との違いが頻出です。", example: "It was a sensible decision." }
        };

        function getDictionaryEntry(word) {
            let lookup = word.replace(/\s+/g, ' ').trim();
            if (lookup.includes("rob") && lookup.includes("of")) return grammarDictionary["rob A of B"];
            if (lookup.includes("explain") && lookup.includes("why")) return grammarDictionary["explain to 人 why"];
            if (lookup.includes("discourage") && lookup.includes("from")) return grammarDictionary["discourage A from V-ing"];
            if (lookup.includes("have") && (lookup.includes("installed") || lookup.includes("controlled") || lookup.includes("upgraded") || lookup.includes("managed") || lookup.includes("developed") || lookup.includes("fixed") || lookup.includes("analyzed") || lookup.includes("automated"))) return grammarDictionary["have O V-p.p."];
            if (lookup.includes("twice as much")) return grammarDictionary["twice as much as"];
            if (lookup.includes("than that of")) return grammarDictionary["that of"];
            if (lookup.includes("remind") && lookup.includes("of")) return grammarDictionary["remind A of B"];
            if (lookup.includes("tell") && lookup.includes("from")) return grammarDictionary["tell A from B"];
            if (lookup.includes("do ") && lookup.includes("harm")) return grammarDictionary["do great harm"];
            if (lookup.includes("friend of mine")) return grammarDictionary["an American friend of mine"];
            if (lookup.includes("every two") || lookup.includes("every three") || lookup.includes("every few")) return grammarDictionary["every two years"];
            if (lookup.includes("convenient for")) return grammarDictionary["convenient for"];

            if (!currentTest) return;

            const extractEnglish = (text) => text.replace(/\[([^|\]]+)(?:\|[^\]]+)*\]/g, '$1');

            // パッセージのクリーンアップと段落化
            const cleanPassage = extractEnglish(currentTest.passage);

                questionsHTML += `<div style="margin-top: 15px; margin-bottom: 10px;"><strong>Q${qIdx + 1}. ${cleanQ}</strong></div>`;
                questionsHTML += `<ol style="list-style-type: upper-alpha; margin-top: 5px; margin-bottom: 15px; padding-left: 20px;">`;
                qObj.options.forEach(opt => {
                    const cleanOpt = extractEnglish(opt);
                    questionsHTML += `<li>${cleanOpt}</li>`;
                });
                questionsHTML += `</ol>`;
            });
            questionsHTML += '</div>';

            // Word用のHTMLテンプレート (BOMを付与して文字化け防止)
            const htmlContent = `
                <html xmlns:o='urn:schemas-microsoft-com:office:office' xmlns:w='urn:schemas-microsoft-com:office:word' xmlns='http://www.w3.org/TR/REC-html40'>
                <head>

                        h3 { font-size: 12pt; font-weight: bold; border-bottom: 1px solid #000; padding-bottom: 5px; }

            `;

            // Blob経由でダウンロード実行
            const blob = new Blob(['\ufeff', htmlContent], { type: 'application/msword' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url;
            // ファイル名から使用不可文字を置換
            link.download = `${currentTest.title.replace(/[:\\/\\?*|"<>\n\r]/g, '_')}.doc`;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(url);
        };

        function createRegexForTerm(term) {
            let escaped = term.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
            escaped = escaped.replace(/\bA\b|\bB\b|人|物/g, '(?:[\\w\\s\\-,\']){1,100}');
            escaped = escaped.replace(/\\\.\\\.\\\./g, '(?:.*?)');
            
            escaped = escaped.replace(/\b(feel|discuss|explain|do|rob|discourage|have|had|rise|remind|tell|lie|fall|result|turn|put|set|succeed|lay|give|make|call|take|come|apply|figure|deal|keep|get|stand|cope|run|go|count|carry|major|find|look|break|wait|hand|cost|spend|throw|buy|rule)\b/gi, 
                function(match) {
                    const verbs = {
                        'feel': '(?:feel|feels|felt)', 'discuss': '(?:discuss|discusses|discussed|discussing)', 'explain': '(?:explain|explains|explained|explaining)',
                        'do': '(?:do|does|did|done|doing)', 'rob': '(?:rob|robs|robbed|robbing)', 'discourage': '(?:discourage|discourages|discouraged|discouraging)',
                        'have': '(?:have|has|had|having)', 'had': '(?:have|has|had|having)', 'rise': '(?:rise|rises|rose|risen|rising)',
                        'remind': '(?:remind|reminds|reminded|reminding)', 'tell': '(?:tell|tells|told|telling)', 'lie': '(?:lie|lies|lay|lain|lying)',
                        'fall': '(?:fall|falls|fell|fallen|falling)', 'result': '(?:result|results|resulted|resulting)', 'turn': '(?:turn|turns|turned|turning)',
                        'put': '(?:put|puts|putting)', 'set': '(?:set|sets|setting)', 'succeed': '(?:succeed|succeeds|succeeded|succeeding)',
                        'lay': '(?:lay|lays|laid|laying)', 'give': '(?:give|gives|gave|given|giving)', 'make': '(?:make|makes|made|making)',
                        'call': '(?:call|calls|called|calling)', 'take': '(?:take|takes|took|taken|taking)', 'come': '(?:come|comes|came|coming)',
                        'apply': '(?:apply|applies|applied|applying)', 'figure': '(?:figure|figures|figured|figuring)', 'deal': '(?:deal|deals|dealt|dealing)',
                        'keep': '(?:keep|keeps|kept|keeping)', 'get': '(?:get|gets|got|gotten|getting)', 'stand': '(?:stand|stands|stood|standing)',
                        'cope': '(?:cope|copes|coped|coping)', 'run': '(?:run|runs|ran|running)', 'go': '(?:go|goes|went|gone|going)',
                        'count': '(?:count|counts|counted|counting)', 'carry': '(?:carry|carries|carried|carrying)', 'major': '(?:major|majors|majored|majoring)',
                        'find': '(?:find|finds|found|finding)', 'look': '(?:look|looks|looked|looking)', 'break': '(?:break|breaks|broke|broken|breaking)',
                        'wait': '(?:wait|waits|waited|waiting)', 'hand': '(?:hand|hands|handed|handing)', 'throw': '(?:throw|throws|threw|thrown|throwing)',
                        'buy': '(?:buy|buys|bought|buying)', 'rule': '(?:rule|rules|ruled|ruling)'
                    };
                    return verbs[match.toLowerCase()] || match;
                }
            );
            const regexStr = '\\b' + escaped.replace(/\\\s+/g, '\\s+') + '\\b';
            return new RegExp(regexStr, 'gi');
        }

        function highlightAllTerms(enText, testId) {
            const test = testData.find(t => t.id === testId);
            if (!test || !test.notes) return enText;

            let termCategoryMap = {};
            let allTerms = [];
            test.notes.forEach(note => {
                let category = 'modifiers';
                if (note.title.includes('動詞')) category = 'verbs';
                else if (note.title.includes('イディオム')) category = 'idioms';
                else if (note.title.includes('比較')) category = 'comparisons';
                else if (note.title.includes('代名詞')) category = 'modifiers';

                note.items.forEach(item => {
                    const splitIndex = item.indexOf(':');
                    let word = splitIndex !== -1 ? item.substring(0, splitIndex).trim() : item.trim();
                    if(word.length >= 3) {
                        allTerms.push(word);
                        termCategoryMap[word] = category;
                    }
                });
            });
            allTerms.sort((a, b) => b.length - a.length);

            let highlightedText = enText;
            allTerms.forEach(term => {
                try {
                    const regex = createRegexForTerm(term);
                    const cat = termCategoryMap[term];
                    const dictEntry = getDictionaryEntry(term);
                    const safeDesc = dictEntry ? dictEntry.detail.replace(/"/g, '&quot;') : '';
                    
                    highlightedText = highlightedText.replace(regex, (match, offset, string) => {
                        const before = string.substring(0, offset);
                        const openSpans = (before.match(/<span/g) || []).length;
                        const closeSpans = (before.match(/<\/span>/g) || []).length;
                        if (openSpans > closeSpans) return match; 
                        return `<span class="grammar-item hl-${cat}" data-desc="${safeDesc}">${match}</span>`;
                    });
                } catch(e) {
                    console.error("Regex error for term: ", term);
                }
            });
            return highlightedText;
        }

        /* 共通のテキスト処理（ルビ・スラッシュ・ハイライト）関数 */
        function processTextWithHighlight(text, testId) {
            let result = '';
            const chunks = [...text.matchAll(/\[(.*?)\|(.*?)(?:\|(.*?))?\]/g)];
            if(chunks.length === 0) {
                result += highlightAllTerms(text, testId);
            } else {
                let lastIndex = 0;
                chunks.forEach((match) => {
                    if (match.index > lastIndex) {
                        result += highlightAllTerms(text.substring(lastIndex, match.index), testId);
                    }
                    let enText = match[1];
                    let jaText = match[2];
                    let paraText = match[3] || enText;
                    let highlightedEn = highlightAllTerms(enText, testId);
                    result += `<ruby>${highlightedEn}<span class="slash">/</span><rt class="translation">${jaText}</rt><rt class="paraphrase">${paraText}</rt></ruby> `;
                    lastIndex = match.index + match[0].length;
                });
                if (lastIndex < text.length) {
                    result += highlightAllTerms(text.substring(lastIndex), testId);
                }
            }
            return result;
        }

                    html += `
                        <div class="notes-section-block bg-white rounded-2xl p-6 shadow-[0_4px_20px_-4px_rgba(0,0,0,0.05)] border border-slate-200/60 transition-all hover:border-indigo-200">
                            <h4 class="text-lg font-black text-indigo-800 mb-5 pb-3 border-b-2 border-slate-100 flex items-center gap-2">
                                <span class="text-indigo-400">❖</span> ${section.title}
                            </h4>
                            <ul class="space-y-6 print:space-y-2">
                    `;
                    section.items.forEach(item => {
                        const splitIndex = item.indexOf(':');
                        let word = splitIndex !== -1 ? item.substring(0, splitIndex).trim() : item.trim();
                        let meaning = splitIndex !== -1 ? item.substring(splitIndex + 1).trim() : '';
                        const dictEntry = getDictionaryEntry(word);

                        html += `
                            <li class="border-b border-slate-50 pb-6 last:border-0 last:pb-0 group print:border-slate-200 print:pb-4">
                                <div class="flex flex-wrap items-center gap-3 mb-3">
                                    <span class="font-black text-slate-800 text-[17px] group-hover:text-indigo-600 transition-colors">${word}</span>
                                    ${meaning ? `<span class="text-indigo-700 font-bold text-[13px] bg-indigo-50/80 px-3 py-1 rounded-md border border-indigo-100/50">${meaning}</span>` : ''}
                                </div>
                                ${dictEntry ? `
                                    <div class="mt-3 text-[14.5px] text-slate-700 leading-relaxed bg-slate-50/70 p-5 rounded-xl border border-slate-200/60 shadow-inner">
                                        <p class="mb-4 text-slate-800 border-l-4 border-amber-400 pl-3">
                                            <span class="font-black text-amber-600 mr-1.5 block mb-1">📝 Point:</span> ${dictEntry.detail}
                                        </p>
                                        <div class="bg-white p-4 rounded-lg text-slate-600 border border-slate-200 shadow-sm flex flex-col gap-1.5">
                                            <span class="font-black text-emerald-500">Ex.</span> <p class="leading-loose">${dictEntry.example}</p>
                                        </div>
                                    </div>
                                ` : `<p class="text-[13px] text-slate-400 mt-1.5 font-medium pl-1">※文脈から意味を瞬時に取れるように復習しましょう。</p>`}
                            </li>
                        `;
                    });
                    html += `</ul></div>`;
                });
                html += `</div></div></div>`;
            }

            mainContentContainer.innerHTML = html;
            attachToolListeners();
            applyActiveHighlights();
            attachHoverReadingListeners();
        }

        function attachToolListeners() {
            const toggleBtn = (btnId, stateKey, activeClasses, inactiveClasses, itemClass) => {
                const btn = document.getElementById(btnId);
                if(!btn) return;
                btn.onclick = () => {
                    state[stateKey] = !state[stateKey];
                    const isActive = state[stateKey];
                    
                    if (isActive) {
                        inactiveClasses.forEach(c => btn.classList.remove(c));
                        activeClasses.forEach(c => btn.classList.add(c));
                        if (itemClass) document.querySelectorAll(itemClass).forEach(el => el.classList.add('active'));
                    } else {
                        activeClasses.forEach(c => btn.classList.remove(c));
                        inactiveClasses.forEach(c => btn.classList.add(c));
                        if (itemClass) document.querySelectorAll(itemClass).forEach(el => el.classList.remove('active'));
                        if (itemClass) hideInfoPanel();
                    }
                    
                    if (stateKey === 'slashActive') {
                        const container = document.getElementById('story-container');
                        if(isActive) container.classList.add('slash-mode-active');
                        else container.classList.remove('slash-mode-active');
                    }
                };
            };

            toggleBtn('btn-verbs', 'verbsActive', ['bg-blue-600', 'text-white', 'border-transparent'], ['border-blue-400', 'text-blue-600', 'bg-white', 'hover:bg-blue-50'], '.hl-verbs');
            toggleBtn('btn-idioms', 'idiomsActive', ['bg-amber-600', 'text-white', 'border-transparent'], ['border-amber-400', 'text-amber-600', 'bg-white', 'hover:bg-amber-50'], '.hl-idioms');
            toggleBtn('btn-comparisons', 'comparisonsActive', ['bg-emerald-600', 'text-white', 'border-transparent'], ['border-emerald-400', 'text-emerald-600', 'bg-white', 'hover:bg-emerald-50'], '.hl-comparisons');
            toggleBtn('btn-modifiers', 'modifiersActive', ['bg-teal-600', 'text-white', 'border-transparent'], ['border-teal-400', 'text-teal-600', 'bg-white', 'hover:bg-teal-50'], '.hl-modifiers');
            toggleBtn('btn-slash', 'slashActive', ['bg-purple-600', 'text-white', 'border-transparent'], ['border-purple-400', 'text-purple-600', 'bg-white', 'hover:bg-purple-50'], null);
            
            const toggleMode = (btnId, stateKey, otherStateKey, activeClasses, inactiveClasses, modeClass, otherModeClass) => {
                const btn = document.getElementById(btnId);
                if(!btn) return;
                btn.onclick = () => {
                    state[stateKey] = !state[stateKey];
                    if (state[stateKey] && otherStateKey) {
                        state[otherStateKey] = false;
                    }
                    
                    const container = document.getElementById('story-container');
                    if (container) {
                        if (state[stateKey]) {
                            container.classList.add(modeClass);
                            btn.classList.remove(...inactiveClasses);
                            btn.classList.add(...activeClasses);
                        } else {
                            container.classList.remove(modeClass);
                            btn.classList.remove(...activeClasses);
                            btn.classList.add(...inactiveClasses);
                        }
                        
                        if (otherStateKey) {
                            const otherBtn = document.getElementById(otherStateKey === 'transActive' ? 'btn-trans' : 'btn-para');
                            if (otherBtn) {
                                container.classList.remove(otherModeClass);
                                if (otherStateKey === 'transActive') {
                                    otherBtn.className = "px-3.5 py-1.5 rounded-full border-2 font-bold transition-all text-[13px] shadow-sm bg-white text-pink-600 border-pink-400 hover:bg-pink-50";
                                } else {
                                    otherBtn.className = "px-3.5 py-1.5 rounded-full border-2 font-bold transition-all text-[13px] shadow-sm bg-white text-sky-600 border-sky-400 hover:bg-sky-50";
                                }
                            }
                        }
                    }
                };
            };
            
            toggleMode('btn-trans', 'transActive', 'paraActive', ['bg-pink-600', 'text-white', 'border-transparent'], ['border-pink-400', 'text-pink-600', 'bg-white', 'hover:bg-pink-50'], 'translation-mode-active', 'paraphrase-mode-active');
            toggleMode('btn-para', 'paraActive', 'transActive', ['bg-sky-600', 'text-white', 'border-transparent'], ['border-sky-400', 'text-sky-600', 'bg-white', 'hover:bg-sky-50'], 'paraphrase-mode-active', 'translation-mode-active');

            document.querySelectorAll('.grammar-item').forEach(item => {
                item.addEventListener('click', (e) => {
                    if(!item.classList.contains('active')) return;
                    const description = item.getAttribute('data-desc');
                    let title = ""; let colorClass = "";
                    if (item.classList.contains('hl-verbs')) { title = "動詞の語法"; colorClass = "text-blue-400"; }
                    else if (item.classList.contains('hl-idioms')) { title = "イディオム"; colorClass = "text-amber-400"; }
                    else if (item.classList.contains('hl-comparisons')) { title = "比較"; colorClass = "text-emerald-400"; }
                    else if (item.classList.contains('hl-modifiers')) { title = "代名詞・形容副詞"; colorClass = "text-teal-400"; }
                    
                    document.getElementById('info-title').className = `font-bold text-lg mb-1 ${colorClass}`;
                    document.getElementById('info-title').textContent = title;
                    document.getElementById('info-desc').innerHTML = description || "詳細情報はありません。";
                    
                    const panel = document.getElementById('info-panel');
                    panel.classList.remove('opacity-0', 'pointer-events-none', 'translate-y-2');
                    panel.classList.add('opacity-100', 'pointer-events-auto', 'translate-y-0');
                    e.stopPropagation();
                });
            });

            const speedSlider = document.getElementById('speed-slider');
            const speedDisplay = document.getElementById('speed-display');
            
            const btnPlayPassage = document.getElementById('btn-play-passage');
            const btnPlayAll = document.getElementById('btn-play-all');
            const btnPause = document.getElementById('btn-pause');
            const btnStop = document.getElementById('btn-stop');

            if(speedSlider) {
                speedSlider.addEventListener('input', (e) => {
                    state.tts.speed = parseFloat(e.target.value);
                    speedDisplay.textContent = state.tts.speed.toFixed(1) + 'x';
                    if (currentUtterance) currentUtterance.rate = state.tts.speed;
                });
                
                speedSlider.addEventListener('change', (e) => {
                    if (synth && (synth.speaking || synth.pending)) {
                        const wasPlaying = isPlaying;
                        const wasPaused = isPaused;
                        const currentIndex = currentQueueIndex;
                        
                        isPlaying = false; 
                        synth.cancel();
                        
                        setTimeout(() => {
                            currentQueueIndex = currentIndex;
                            isPlaying = wasPlaying;
                            isPaused = wasPaused;
                            
                            if (isPlaying && !isPaused) {
                                speakNextInQueue();
                            }
                        }, 50);
                    }
                });
            }

            if(btnPlayPassage) btnPlayPassage.addEventListener('click', () => startPassageReading(true));
            if(btnPlayAll) btnPlayAll.addEventListener('click', () => startPassageReading(false));
            if(btnPause) btnPause.addEventListener('click', pauseText);
            if(btnStop) btnStop.addEventListener('click', stopText);
        }

        function applyActiveHighlights() {
            if (state.verbsActive) document.querySelectorAll('.hl-verbs').forEach(el => el.classList.add('active'));
            if (state.idiomsActive) document.querySelectorAll('.hl-idioms').forEach(el => el.classList.add('active'));
            if (state.comparisonsActive) document.querySelectorAll('.hl-comparisons').forEach(el => el.classList.add('active'));
            if (state.modifiersActive) document.querySelectorAll('.hl-modifiers').forEach(el => el.classList.add('active'));
        }

        function hideInfoPanel() {
            const panel = document.getElementById('info-panel');
            if (panel) {
                panel.classList.remove('opacity-100', 'pointer-events-auto', 'translate-y-0');
                panel.classList.add('opacity-0', 'pointer-events-none', 'translate-y-2');
            }
        }

        document.getElementById('close-panel').addEventListener('click', hideInfoPanel);
        document.addEventListener('click', (e) => {
            const panel = document.getElementById('info-panel');
            if (panel && !panel.contains(e.target) && !e.target.classList.contains('grammar-item')) {
                hideInfoPanel();
            }
        });

        let ttsQueue = [];
        let currentQueueIndex = 0;
        let isAutoReadingAll = false;
        let currentHighlightEl = null;

        function extractCleanText(el) {
            const clone = el.cloneNode(true);
            clone.querySelectorAll('rt, .slash, .not-spoken').forEach(e => e.remove());
            return clone.textContent.replace(/\s+/g, ' ').trim();
        }

        // 読み上げ音声の最適化（質問番号・選択肢アルファベットの調整）
        function preprocessTTS(text, type, idx) {
            if (type === 'question') {
                return `Question ${idx + 1}. ` + text;
            } else if (type === 'option') {
                const letter = String.fromCharCode(65 + idx);
                // "A," とすることで、冠詞の a（ア）ではなくエイとして読ませる
                return `${letter}, ` + text;
            }
            return text; 
        }

        function buildTTSQueue(passageOnly) {
            ttsQueue = [];
            document.querySelectorAll('.hover-readable[data-speak-type="passage"]').forEach(el => {
                ttsQueue.push({ el: el, text: extractCleanText(el), type: 'passage' });
            });
            
            if (!passageOnly) {
                document.querySelectorAll('.question-block').forEach((qBlock, qIdx) => {
                    const qEl = qBlock.querySelector('.hover-readable[data-speak-type="question"]');
                    if (qEl) {
                        ttsQueue.push({ el: qEl, text: preprocessTTS(extractCleanText(qEl), 'question', qIdx), type: 'question' });
                    }
                    qBlock.querySelectorAll('.hover-readable[data-speak-type="option"]').forEach((optBtn, optIdx) => {
                         ttsQueue.push({ el: optBtn, text: preprocessTTS(extractCleanText(optBtn), 'option', optIdx), type: 'option' });
                    });
                });
            }
        }

        function attachHoverReadingListeners() {
            document.querySelectorAll('.hover-readable').forEach(el => {
                el.addEventListener('mouseenter', (e) => {
                    if (isPlaying) return; // 全体読み上げ中はホバー読み上げを無効化
                    
                    let textToSpeak = extractCleanText(el);
                    const type = el.getAttribute('data-speak-type');
                    const idx = parseInt(el.getAttribute('data-speak-idx'), 10) || 0;
                    
                    textToSpeak = preprocessTTS(textToSpeak, type, idx);
                    
                    if (textToSpeak && synth) {
                        synth.cancel();
                        let utterance = new SpeechSynthesisUtterance(textToSpeak);
                        utterance.lang = 'en-US';
                        if (englishVoice) utterance.voice = englishVoice;
                        utterance.rate = state.tts.speed;
                        
                        el.classList.add('hover-reading-highlight');
                        
                        utterance.onend = () => el.classList.remove('hover-reading-highlight');
                        utterance.onerror = () => el.classList.remove('hover-reading-highlight');
                        
                        synth.speak(utterance);
                    }
                });
                
                el.addEventListener('mouseleave', (e) => {
                    if (isPlaying) return;
                    if (synth) synth.cancel();
                    el.classList.remove('hover-reading-highlight');
                });
            });
        }

        function updateTTSButtons() {
            const btnPlayPassage = document.getElementById('btn-play-passage');
            const btnPlayAll = document.getElementById('btn-play-all');
            const btnPause = document.getElementById('btn-pause');
            const btnStop = document.getElementById('btn-stop');
            
            if(!btnPlayPassage || !btnPlayAll) return;

            if (isPlaying && !isPaused) {
                btnPlayPassage.classList.add('hidden');
                btnPlayAll.classList.add('hidden');
                btnPause.classList.remove('hidden');
                btnStop.classList.remove('hidden');
            } else if (isPlaying && isPaused) {
                btnPlayPassage.classList.add('hidden');
                btnPlayAll.classList.remove('hidden');
                btnPlayAll.innerHTML = '▶️ 再開';
                btnPause.classList.add('hidden');
                btnStop.classList.remove('hidden');
            } else {
                btnPlayPassage.classList.remove('hidden');
                btnPlayPassage.innerHTML = '▶️ 長文読上';
                btnPlayAll.classList.remove('hidden');
                btnPlayAll.innerHTML = '▶️ 全文・設問読上';
                btnPause.classList.add('hidden');
                btnStop.classList.add('hidden');
            }
        }

        window.startPassageReading = function(passageOnly) {
            if (synth && synth.speaking && isPaused) {
                synth.resume();
                isPaused = false;
                updateTTSButtons();
                return;
            }
            
            stopText();
            isAutoReadingAll = !passageOnly;
            isPlaying = true;
            isPaused = false;
            
            buildTTSQueue(passageOnly);
            currentQueueIndex = 0;
            
            updateTTSButtons();
            speakNextInQueue();
        };

        function speakNextInQueue() {
            if (currentQueueIndex >= ttsQueue.length) {
                stopText();
                return;
            }
            
            const item = ttsQueue[currentQueueIndex];
            const text = item.text;
            
            if (!text) {
                currentQueueIndex++;
                speakNextInQueue();
                return;
            }
            
            if (currentHighlightEl) {
                currentHighlightEl.classList.remove('reading-highlight');
            }
            
            item.el.scrollIntoView({ behavior: 'smooth', block: 'center' });
            item.el.classList.add('reading-highlight');
            currentHighlightEl = item.el;
            
            currentUtterance = new SpeechSynthesisUtterance(text);
            currentUtterance.lang = 'en-US';
            if (englishVoice) currentUtterance.voice = englishVoice;
            currentUtterance.rate = state.tts.speed;
            
            currentUtterance.onend = () => {
                if (isPlaying && !isPaused) {
                    currentQueueIndex++;
                    speakNextInQueue();
                }
            };
            
            currentUtterance.onerror = (e) => {
                if(e.error !== 'canceled' && e.error !== 'interrupted') {
                    console.error("Speech synthesis error", e);
                    stopText();
                }
            };

            if (synth) synth.speak(currentUtterance);
        }

        window.pauseText = function() {
            if (synth && synth.speaking) {
                synth.pause();
                isPaused = true;
                updateTTSButtons();
            }
        };

        window.stopText = function() {
            if (synth) synth.cancel();
            isPlaying = false;
            isPaused = false;
            isAutoReadingAll = false;
            currentQueueIndex = 0;
            if (currentHighlightEl) {
                currentHighlightEl.classList.remove('reading-highlight');
                currentHighlightEl = null;
            }
            updateTTSButtons();
        };

        window.addEventListener('pagehide', stopText);
        window.addEventListener('beforeunload', stopText);

        function renderApp() {
            renderSidebar();
            renderMainContent();
        }

        document.addEventListener('DOMContentLoaded', renderApp);
    </script>
</body>
</html>
